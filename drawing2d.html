<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2D Drawing</title>
<!-- Datum 2D Drawing: an AutoCAD-style 2D drafting workspace. Self-contained (no libraries) and independent of the 3D modeler:
     its own document, layers, command line, snaps, DXF import / export and plotting. Datum opens it in its own workspace tab. -->
<style>
:root { --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f6; --rule:#d5dbe5; --ink:#1b2430; --ink2:#38465a; --muted:#6a778b; --accent:#2f7de1; --accent-soft:#e2edfc; --danger:#d6453d; --ok:#2e9d5b;
  --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --shadow:0 8px 28px rgba(15,25,40,.18); }
:root[data-theme="dark"] { --bg:#13161b; --panel:#1b1f26; --panel2:#232831; --rule:#323945; --ink:#e8edf4; --ink2:#c3ccd9; --muted:#8f9cb0; --accent:#58a6ff; --accent-soft:#1b2d46; --danger:#ff6b61; --ok:#4cd37a; --shadow:0 8px 28px rgba(0,0,0,.5); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 var(--font); overflow:hidden; -webkit-font-smoothing:antialiased; }
button, select, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
#app { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto auto; height:100vh; height:100dvh; }
/* title / tabs */
#top { display:flex; align-items:stretch; gap:6px; padding:3px 8px 0; background:var(--panel); border-bottom:1px solid var(--rule); min-width:0; }
.tl { display:flex; align-items:center; gap:4px; padding-right:8px; border-right:1px solid var(--rule); margin-right:2px; flex:none; }
.logo { font-weight:700; letter-spacing:.02em; color:var(--accent); padding:0 6px 0 2px; white-space:nowrap; }
.tb { border:1px solid transparent; background:transparent; border-radius:6px; padding:4px 8px; display:inline-flex; align-items:center; gap:5px; color:var(--ink2); white-space:nowrap; }
.tb:hover { background:var(--panel2); border-color:var(--rule); } .tb:disabled { opacity:.4; }
.tb svg { width:16px; height:16px; }
#fname { color:var(--muted); font-size:12px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px; }
#rtabs { display:flex; align-items:flex-end; gap:2px; overflow-x:auto; scrollbar-width:none; }
.rtab { border:0; background:transparent; padding:7px 14px 6px; border-radius:7px 7px 0 0; color:var(--muted); font-weight:500; border-bottom:2px solid transparent; }
.rtab:hover { color:var(--ink); } .rtab.on { color:var(--accent); border-bottom-color:var(--accent); background:var(--panel2); }
#rbody { display:flex; align-items:stretch; background:var(--panel2); border-bottom:1px solid var(--rule); overflow-x:auto; overflow-y:hidden; padding:4px 4px 0; min-height:86px; scrollbar-width:thin; }
.rpanel { display:flex; flex-direction:column; flex:none; padding:0 6px 0; border-right:1px solid var(--rule); max-width:640px; }
.rpanel:last-child { border-right:0; }
.rbtns { display:flex; flex-wrap:wrap; align-content:flex-start; gap:2px; flex:1; max-width:560px; padding-top:2px; }
.rtitle { font:600 9.5px/1 var(--font); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); text-align:center; padding:4px 0 5px; white-space:nowrap; }
.rbtn { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:2px; width:54px; padding:4px 2px 3px; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--ink2); }
.rbtn span { font-size:10.5px; line-height:1.15; text-align:center; max-width:52px; }
.rbtn:hover { background:var(--panel); border-color:var(--rule); color:var(--ink); }
.rbtn.active, .rbtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.rbtn svg { color:var(--accent); } .rbtn.active svg, .rbtn.on svg { color:var(--accent); }
.rbtn .rdrop { position:absolute; right:1px; top:1px; width:15px; height:15px; display:flex; align-items:center; justify-content:center; border-radius:4px; color:var(--muted); font-style:normal; }
.rbtn .rdrop:hover { background:var(--accent-soft); color:var(--accent); }
.rbtn.big { width:62px; } .rcol { display:flex; flex-direction:column; gap:3px; justify-content:center; } .rcol.w { width:210px; } .rcol.w2 { width:150px; } .rrow { display:flex; gap:4px; align-items:center; } .rrow.sm { gap:2px; flex-wrap:wrap; }
.rrow.sm button { border:1px solid var(--rule); background:var(--panel); border-radius:5px; padding:1px 6px; font-size:11px; color:var(--ink2); } .rrow.sm button:hover { border-color:var(--accent); color:var(--accent); }
#rbody select, .prow select, .grid2 select, #dlgCard select { height:26px; border:1px solid var(--rule); border-radius:6px; background:var(--panel); padding:0 6px; min-width:0; width:100%; }
.colorbtn { display:flex; align-items:center; gap:6px; height:26px; width:100%; border:1px solid var(--rule); border-radius:6px; background:var(--panel); padding:0 7px; font-size:12px; }
.colorbtn i { width:13px; height:13px; border-radius:3px; border:1px solid rgba(128,128,128,.5); flex:none; } .colorbtn.sm { height:24px; }
/* work area */
#work { display:flex; min-height:0; position:relative; }
#vp { position:relative; flex:1; min-width:0; overflow:hidden; background:#1e2127; cursor:none; }
#vp canvas { position:absolute; inset:0; display:block; } #ov { pointer-events:none; }
.pal { width:330px; flex:none; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--rule); min-height:0; }
#propPal { width:250px; border-right:0; border-left:1px solid var(--rule); } .pal[hidden] { display:none; }
.phead { display:flex; align-items:center; justify-content:space-between; padding:6px 8px 6px 12px; border-bottom:1px solid var(--rule); font-weight:600; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); }
.phead button { border:0; background:transparent; font-size:16px; line-height:1; color:var(--muted); border-radius:4px; padding:2px 6px; } .phead button:hover { background:var(--panel2); color:var(--ink); }
#layerTbl { overflow:auto; flex:1; } #layerTbl table { border-collapse:collapse; width:100%; font-size:12px; }
#layerTbl th { position:sticky; top:0; background:var(--panel); font:600 10px var(--font); color:var(--muted); text-align:left; padding:4px 3px; border-bottom:1px solid var(--rule); text-transform:uppercase; letter-spacing:.05em; }
#layerTbl td { padding:2px 2px; border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent); white-space:nowrap; }
#layerTbl tr.cur { background:var(--accent-soft); } #layerTbl td.ln { max-width:78px; overflow:hidden; text-overflow:ellipsis; cursor:default; font-weight:500; }
.lb { border:0; background:transparent; width:22px; height:22px; border-radius:4px; font-size:12px; color:var(--muted); padding:0; } .lb:hover { background:var(--panel2); } .lb.on { color:var(--accent); } .lb.frz { color:#4aa3ff; }
.lsw { width:18px; height:18px; border:1px solid rgba(128,128,128,.55); border-radius:4px; padding:0; } #layerTbl select { height:22px; font-size:11px; padding:0 2px; width:74px; border:1px solid var(--rule); border-radius:4px; background:var(--panel); } #layerTbl td:nth-child(8) select { width:56px; }
.pfoot { display:flex; gap:6px; padding:8px; border-top:1px solid var(--rule); } .btn { border:1px solid var(--rule); background:var(--panel); border-radius:7px; padding:5px 12px; } .btn:hover { border-color:var(--accent); } .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
#propBody { overflow:auto; flex:1; padding:6px 10px 12px; } .pgroup { margin-bottom:10px; } .pgroup h4 { margin:8px 0 4px; font:600 10.5px var(--font); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.prow { display:grid; grid-template-columns:92px 1fr; align-items:center; gap:6px; padding:2px 0; font-size:12px; } .prow > span { color:var(--muted); } .prow input[type=text], .prow input[type=number] { width:100%; height:24px; border:1px solid var(--rule); border-radius:5px; background:var(--panel); padding:0 6px; } .phint { color:var(--muted); font-size:12px; padding:6px 2px; line-height:1.5; }
/* command line */
#cmdwrap { background:var(--panel); border-top:1px solid var(--rule); display:flex; flex-direction:column; }
#cmdHist { height:64px; overflow-y:auto; padding:4px 12px 2px; font:12px/1.45 var(--mono); color:var(--muted); background:color-mix(in srgb,var(--panel) 90%,var(--bg)); } #cmdwrap.big #cmdHist { height:240px; }
#cmdHist .ln.err { color:var(--danger); } #cmdHist .ln { white-space:pre-wrap; word-break:break-word; }
#cmdRow { display:flex; align-items:center; gap:8px; padding:4px 10px 5px 12px; border-top:1px solid var(--rule); min-width:0; }
#cmdPrompt { font:600 12px var(--mono); color:var(--accent); white-space:nowrap; max-width:55%; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; } #cmdKws { display:flex; gap:4px; flex:none; flex-wrap:wrap; }
#cmdKws button { border:1px solid var(--rule); background:var(--panel2); border-radius:5px; padding:1px 8px; font-size:11.5px; color:var(--ink2); } #cmdKws button:hover { border-color:var(--accent); color:var(--accent); } #cmdKws button.enter { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
#cmdIn { flex:1; min-width:80px; border:0; outline:0; background:transparent; font:13px var(--mono); color:var(--ink); padding:3px 0; }
#status { display:flex; align-items:center; gap:2px; padding:2px 8px; background:var(--panel2); border-top:1px solid var(--rule); font-size:11.5px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
#coord { font-family:var(--mono); min-width:190px; color:var(--ink2); padding:0 8px 0 4px; flex:none; }
.stbtn { border:1px solid transparent; background:transparent; border-radius:5px; padding:2px 7px; font:600 10.5px var(--font); letter-spacing:.06em; color:var(--muted); flex:none; } .stbtn:hover { background:var(--panel); } .stbtn.on { color:var(--accent); background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
.sp { flex:1; } .stl { color:var(--muted); padding:0 8px; flex:none; border:0; background:transparent; font-size:11.5px; } button.stl:hover { color:var(--accent); }
#toast { position:absolute; left:50%; bottom:18px; transform:translate(-50%,12px); background:rgba(20,24,30,.92); color:#fff; padding:7px 14px; border-radius:20px; font-size:12.5px; opacity:0; transition:.2s; pointer-events:none; z-index:3; } #toast.on { opacity:1; transform:translate(-50%,0); }
#dropHint { position:absolute; inset:12px; border:2px dashed var(--accent); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:16px; background:rgba(40,100,200,.12); z-index:4; } #dropHint[hidden] { display:none; }
.vp-ui { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:4px; z-index:2; cursor:default; } .vp-ui button { width:32px; height:32px; border-radius:8px; border:1px solid var(--rule); background:color-mix(in srgb,var(--panel) 92%,transparent); color:var(--ink2); display:flex; align-items:center; justify-content:center; padding:0; } .vp-ui button:hover { border-color:var(--accent); color:var(--accent); } .vp-ui svg { width:18px; height:18px; }
#vp .vp-ui, #vp .vp-ui * { cursor:pointer; }
/* menus & dialogs */
#ctx { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--rule); border-radius:9px; box-shadow:var(--shadow); padding:4px; min-width:190px; max-height:70vh; overflow:auto; } #ctx[hidden] { display:none; }
#ctx button { display:block; width:100%; text-align:left; border:0; background:transparent; padding:6px 12px; border-radius:6px; color:var(--ink); } #ctx button:hover:not(:disabled) { background:var(--accent-soft); color:var(--accent); } #ctx button:disabled { color:var(--muted); cursor:default; } #ctx hr { border:0; border-top:1px solid var(--rule); margin:4px 2px; }
#dlg { position:fixed; inset:0; z-index:60; background:rgba(8,12,18,.5); display:flex; align-items:center; justify-content:center; padding:16px; } #dlg[hidden] { display:none; }
.card { background:var(--panel); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow); width:min(380px,100%); max-height:92vh; display:flex; flex-direction:column; } .card.wide { width:min(620px,100%); }
.card h3 { margin:0; padding:14px 18px 6px; font-size:15px; } .dbody { padding:6px 18px 4px; overflow:auto; display:flex; flex-direction:column; gap:10px; } .dfoot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px 16px; }
.dbody label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); } .dbody label.chk { flex-direction:row; align-items:center; gap:7px; color:var(--ink2); }
.dbody input[type=text], .dbody input[type=number], .dbody textarea { border:1px solid var(--rule); border-radius:6px; background:var(--panel2); height:30px; padding:0 8px; color:var(--ink); } .dbody textarea { height:auto; padding:8px; font:13px var(--font); resize:vertical; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .hint { color:var(--muted); font-size:12px; line-height:1.5; margin:0; } .osgrid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.swrow { display:flex; gap:4px; flex-wrap:wrap; align-items:center; } .swgrid { display:grid; grid-template-columns:repeat(24,1fr); gap:2px; } .sw { aspect-ratio:1; min-width:0; width:100%; border:1px solid rgba(128,128,128,.4); border-radius:3px; padding:0; } .swrow .sw { width:24px; height:24px; } .sw.on { outline:2px solid var(--accent); outline-offset:1px; }
.hprev canvas { width:100%; border:1px solid var(--rule); border-radius:6px; }
.help { font-size:12.5px; line-height:1.6; } .help kbd { border:1px solid var(--rule); background:var(--panel2); border-radius:4px; padding:0 5px; font:11px var(--mono); } .help code { background:var(--panel2); padding:0 4px; border-radius:3px; font:11.5px var(--mono); } .ctab { border-collapse:collapse; width:100%; margin-top:8px; font-size:12px; } .ctab td, .ctab th { padding:3px 8px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:top; } .ctab th { color:var(--muted); font-weight:600; }
@media (max-width:900px) { #layerPal, #propPal { position:absolute; z-index:10; top:0; bottom:0; box-shadow:var(--shadow); } #propPal { right:0; } .rbtn { width:50px; } #coord { min-width:150px; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="tl">
      <span class="logo" title="Datum 2D Drawing">⌗ 2D Drawing</span>
      <button class="tb" id="btnFile" title="File menu: new, open, save, export, plot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>File</button>
      <span id="fname"></span>
      <button class="tb" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6L4 10l4 4"/><path d="M4 10h9a6 6 0 0 1 0 12H9"/></svg></button>
      <button class="tb" id="btnRedo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6l4 4-4 4"/><path d="M20 10h-9a6 6 0 0 0 0 12h4"/></svg></button>
      <button class="tb" id="btnHelp" title="Commands and shortcuts (F1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h0"/></svg></button>
    </div>
    <div id="rtabs"></div>
  </header>
  <div id="rbody"></div>
  <div id="work">
    <aside class="pal" id="layerPal"><div class="phead"><span>Layers</span><button id="layClose" title="Close">×</button></div><div id="layerTbl"></div><div class="pfoot"><button class="btn" id="layNew">+ New layer</button><button class="btn" id="layDel">Delete current</button></div></aside>
    <div id="vp"><canvas id="cv"></canvas><canvas id="ov"></canvas><div id="toast"></div><div id="dropHint" hidden>Drop a DXF or drawing file to open it</div>
      <div class="vp-ui"><button id="zin" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button id="zout" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button id="zext" title="Zoom extents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg></button></div>
    </div>
    <aside class="pal" id="propPal"><div class="phead"><span>Properties</span><button id="propClose" title="Close">×</button></div><div id="propBody"></div></aside>
  </div>
  <div id="cmdwrap"><div id="cmdHist"></div><div id="cmdRow"><span id="cmdPrompt">Command:</span><span id="cmdKws"></span><input id="cmdIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command line"></div></div>
  <footer id="status">
    <span id="coord">0.0000,  0.0000,  0</span>
    <button class="stbtn" id="st-snap" data-t="snap" title="Snap to grid (F9)">SNAP</button><button class="stbtn" id="st-grid" data-t="grid" title="Grid display (F7)">GRID</button><button class="stbtn" id="st-ortho" data-t="ortho" title="Ortho mode (F8)">ORTHO</button><button class="stbtn" id="st-polar" data-t="polar" title="Polar tracking (F10)">POLAR</button><button class="stbtn" id="st-osnap" data-t="osnap" title="Object snap (F3)">OSNAP</button><button class="stbtn" id="st-lwt" data-t="lwt" title="Show lineweights">LWT</button><button class="stbtn" id="st-dyn" data-t="dyn" title="Dynamic readout near the cursor (F12)">DYN</button>
    <span class="sp"></span><span class="stl" id="selInfo"></span><button class="stl" id="curLayerBtn" title="Current layer — click to open the layer palette">Layer: <b id="curLayer">0</b></button><button class="stl" id="unitsLbl" title="Drawing units"></button><span class="stl" id="zoomLbl" title="Zoom"></span><button class="stl" id="btnHist" title="Command history (F2)">History</button>
  </footer>
</div>
<div id="ctx" hidden></div>
<div id="dlg" hidden><div class="card" id="dlgCard"></div></div>
<input type="file" id="fileIn" accept=".dxf,.json,.d2d,application/json,text/plain" hidden>
<script>
'use strict';
/* ═══ 2D geometry kernel: points are [x, y]; curves are "atoms" — a line segment or a circular arc ═══ */
const TAU = Math.PI * 2, EPS = 1e-9;
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1], crs = (a, b) => a[0] * b[1] - a[1] * b[0];
const len = a => Math.hypot(a[0], a[1]), dst = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const nrm = a => { const l = len(a); return l < 1e-14 ? [1, 0] : [a[0] / l, a[1] / l]; };
const angOf = a => Math.atan2(a[1], a[0]), pol = (c, r, a) => [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const perp = a => [-a[1], a[0]];
const rotP = (p, c, a) => { const s = Math.sin(a), k = Math.cos(a), x = p[0] - c[0], y = p[1] - c[1]; return [c[0] + x * k - y * s, c[1] + x * s + y * k]; };
const na = a => { a %= TAU; return a < 0 ? a + TAU : a; };                       // angle into [0, 2π)
const nsa = a => { a = na(a); return a > Math.PI ? a - TAU : a; };               // angle into (-π, π]
const same = (a, b, t = 1e-7) => Math.abs(a[0] - b[0]) < t && Math.abs(a[1] - b[1]) < t;
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ── atoms ──  seg {t:'s', a, b}   arc {t:'a', c, r, a0, sw}  (sw = signed sweep, |sw| ≤ 2π; a full circle has sw = ±2π)
const seg = (a, b) => ({ t: 's', a, b });
const arcAt = (c, r, a0, sw) => ({ t: 'a', c, r, a0, sw });
function arcFromBulge(p, q, b) {
  const th = 4 * Math.atan(b), d = dst(p, q);
  if (d < 1e-12) return seg(p, q);
  const u = nrm(sub(q, p)), l = perp(u), c = add(mid(p, q), mul(l, (d / 2) / Math.tan(th / 2)));
  return arcAt(c, dst(c, p), angOf(sub(p, c)), th);
}
const bulgeOf = at => at.t === 'a' ? Math.tan(at.sw / 4) : 0;

function openPanel(name, show) { const el = name === 'layers' ? $('#layerPal') : $('#propPal'); el.hidden = show === undefined ? !el.hidden : !show; try { localStorage.setItem('d2d.panel.' + name, el.hidden ? '0' : '1'); } catch (e) { } if (name === 'layers' && !el.hidden) renderLayers(); if (name === 'props' && !el.hidden) updateProps(); setTimeout(sizeCanvases, 30); }

// ── properties palette ──
const row = (label, html) => `<div class="prow"><span>${label}</span><div>${html}</div></div>`;

      case 'circle': g = `<div class="pgroup"><h4>Geometry</h4>${row('Center X', numIn('c:0', e.c[0]))}${row('Center Y', numIn('c:1', e.c[1]))}${row('Radius', numIn('r', e.r))}${row('Diameter', numIn('dia', e.r * 2))}${row('Circumference', fmtU(TAU * e.r))}${row('Area', fmtA(Math.PI * e.r * e.r))}</div>`; break;

      case 'pline': { const pa = prims(e).paths[0]; g = `<div class="pgroup"><h4>Geometry</h4>${row('Vertices', e.pts.length)}${row('Closed', `<input type="checkbox" data-k="closed" ${e.closed ? 'checked' : ''}>`)}${row('Length', fmtU(pathLen(pa)))}${e.closed ? row('Area', fmtA(Math.abs(polyArea(loopPoly(e.pts))))) : ''}</div>`; break; }

function setupPropPanel() {
  const el = $('#propBody');
  el.addEventListener('change', e => {
    const t = e.target, k = t.dataset.k; if (!k) return; const list = [...SEL]; if (!list.length) return;

    if (k === 'layer') { if (val) list.forEach(x => x.layer = val); } else if (k === 'lt') list.forEach(x => x.lt = val || null); else if (k === 'lw') list.forEach(x => x.lw = val === '' ? null : +val);
    else if (list.length === 1) {
      const x = list[0], [f, i] = k.split(':'), n = +val;
      if (i != null) { const nx = cloneEnt(x); nx[f][+i] = n; replaceEnt(x, nx); }
      else if (k === 'dia') { const nx = cloneEnt(x); nx.r = Math.max(1e-9, n / 2); replaceEnt(x, nx); } else if (k === 'r') { const nx = cloneEnt(x); nx.r = Math.max(1e-9, n); replaceEnt(x, nx); }
      else if (k === 'a0d') { const nx = cloneEnt(x); nx.a0 = na(rad(n)); replaceEnt(x, nx); } else if (k === 'a1d') { const nx = cloneEnt(x); nx.a1 = na(rad(n)); replaceEnt(x, nx); }
      else if (k === 'rotd') { const nx = cloneEnt(x); nx.rot = rad(n); replaceEnt(x, nx); } else if (k === 'angd') { const nx = cloneEnt(x); nx.ang = rad(n); replaceEnt(x, nx); }
      else if (k === 'closed') { const nx = cloneEnt(x); nx.closed = !!val; replaceEnt(x, nx); } else if (k === 'str' || k === 'pat') { const nx = cloneEnt(x); nx[k] = val; if (k === 'pat') nx.solid = val === 'SOLID'; replaceEnt(x, nx); }
      else if (k === 'tx') { const nx = cloneEnt(x); nx.tx = val.trim() || null; replaceEnt(x, nx); } else { const nx = cloneEnt(x); nx[k] = n; replaceEnt(x, nx); }
    }

  else items.push(['Repeat ' + (CM.last ? CM.last.toUpperCase() : 'last command'), '_repeat'], ['Recent: ' + (CM.recent.slice(0, 5).map(c => c.toUpperCase()).join(', ') || 'none'), null], ['—'], ['Select all', 'selectall'], ['Paste', 'pasteclip'], ['—'], ['Zoom extents', 'zoomextents'], ['Pan', 'pan'], ['Layers…', 'layer']);

// ── keyboard ──
function setupKeys() {
  cmdIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const t = cmdIn.value; cmdIn.value = ''; CM.histAt = 0; submitText(t); }
    else if (e.key === ' ' && !e.ctrlKey && (!CM.req || !['str', 'num', 'ang'].includes(CM.req.kind) || cmdIn.value === '')) { e.preventDefault(); const t = cmdIn.value; cmdIn.value = ''; submitText(t); }
    else if (e.key === 'ArrowUp' && !CM.req) { e.preventDefault(); const h = CM.hist; if (h.length) { CM.histAt = Math.min(h.length, CM.histAt + 1); cmdIn.value = h[h.length - CM.histAt]; } }
    else if (e.key === 'ArrowDown' && !CM.req) { e.preventDefault(); CM.histAt = Math.max(0, CM.histAt - 1); cmdIn.value = CM.histAt ? CM.hist[CM.hist.length - CM.histAt] : ''; }
    else if (e.key === 'Escape') { e.preventDefault(); cmdIn.value = ''; cancelAll(); }
    e.stopPropagation();
  });
  document.addEventListener('keydown', e => {
    if (!$('#dlg').hidden) return;
    const tag = (e.target.tagName || '').toLowerCase(); const inField = (tag === 'input' || tag === 'textarea' || tag === 'select') && e.target !== cmdIn;
    const ctrl = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') { if (!$('#ctx').hidden) { $('#ctx').hidden = true; return; } if (inField) { e.target.blur(); return; } cancelAll(); return; }
    if (inField) return;
    if (ctrl && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); runCommand('undo'); return; }
    if (ctrl && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); runCommand('redo'); return; }
    if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); runCommand('selectall'); return; }
    if (ctrl && e.key.toLowerCase() === 'c') { if (SEL.size) { e.preventDefault(); runCommand('copyclip'); } return; }
    if (ctrl && e.key.toLowerCase() === 'x') { if (SEL.size) { e.preventDefault(); runCommand('cutclip'); } return; }
    if (ctrl && e.key.toLowerCase() === 'v') { e.preventDefault(); runCommand('pasteclip'); return; }
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
    if (ctrl && e.key.toLowerCase() === 'o') { e.preventDefault(); $('#fileIn').click(); return; }
    if (ctrl && e.key.toLowerCase() === 'p') { e.preventDefault(); plotDialog(); return; }
    if (ctrl && e.key.toLowerCase() === 'n') { e.preventDefault(); runCommand('new'); return; }
    const fk = { F1: () => showHelp(), F2: () => showConsole(), F3: () => toggle('osnap'), F7: () => toggle('grid'), F8: () => toggle('ortho'), F9: () => toggle('snap'), F10: () => toggle('polar'), F12: () => toggle('dyn') }[e.key];
    if (fk) { e.preventDefault(); fk(); return; }
    if (e.key === 'Delete' && !CM.req && SEL.size) { e.preventDefault(); runCommand('erase'); return; }
    if (e.target !== cmdIn && !ctrl && !e.altKey && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const t = cmdIn.value; cmdIn.value = ''; submitText(t); cmdIn.focus(); return; }
    if (e.target !== cmdIn && !ctrl && !e.altKey && e.key.length === 1) { cmdIn.focus(); }
  });
}

  for (const [n, k] of [['layers', true], ['props', true]]) { let v = k; try { const s = localStorage.getItem('d2d.panel.' + n); if (s != null) v = s === '1'; } catch (e) { } if (innerWidth < 900) v = false; (n === 'layers' ? $('#layerPal') : $('#propPal')).hidden = !v; }

  msg('Datum 2D Drawing — type a command (LINE, CIRCLE, RECTANGLE, TRIM …) or use the ribbon. F1 lists every command.');

  window.D2D = { toS, toW, redrawAll, zoomExtents, doc: () => doc, CM, SEL, UI, run: runCommand, submit: submitText, exportDXF, importDXF, loadDocData, exportSVG, prims, entBox, FILE };
}
