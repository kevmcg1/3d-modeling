<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Design</title>
<!-- Datum House Design: a Revit-style building design workspace. Draw walls, doors, windows, rooms, roofs, stairs and dimensions on
     2D level plans and watch them extrude live into a 3D model. Self-contained (no libraries), imperial units, independent of the
     3D modeler: its own document (JSON), DXF plan export and OBJ model export. Datum opens it in its own workspace tab. -->
<style>
:root { --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f6; --rule:#d5dbe5; --ink:#1b2430; --ink2:#38465a; --muted:#6a778b; --accent:#2f7de1; --accent-soft:#e2edfc; --danger:#d6453d; --ok:#2e9d5b;
  --paper:#fbfcfd; --grid:#e6eaf0; --grid2:#d3d9e3; --wallfill:#c9d0da; --walledge:#2b3441; --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --shadow:0 8px 28px rgba(15,25,40,.18); }
:root[data-theme="dark"] { --bg:#13161b; --panel:#1b1f26; --panel2:#232831; --rule:#323945; --ink:#e8edf4; --ink2:#c3ccd9; --muted:#8f9cb0; --accent:#58a6ff; --accent-soft:#1b2d46; --danger:#ff6b61; --ok:#4cc38a;
  --paper:#1a1e25; --grid:#242a33; --grid2:#313947; --wallfill:#59647a; --walledge:#cfd7e3; --shadow:0 8px 28px rgba(0,0,0,.5); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 var(--font); overflow:hidden; -webkit-font-smoothing:antialiased; }
button, select, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
#app { display:grid; grid-template-rows:auto auto auto minmax(0,1fr) auto; height:100vh; height:100dvh; }
#top { display:flex; align-items:center; gap:6px; padding:4px 8px; background:var(--panel); border-bottom:1px solid var(--rule); min-width:0; flex-wrap:wrap; }
.logo { font-weight:700; letter-spacing:.02em; color:var(--accent); padding:0 8px 0 2px; white-space:nowrap; }
.sep { width:1px; align-self:stretch; background:var(--rule); margin:2px 4px; }
.tb { border:1px solid transparent; background:transparent; border-radius:6px; padding:4px 9px; display:inline-flex; align-items:center; gap:5px; color:var(--ink2); white-space:nowrap; }
.tb:hover { background:var(--panel2); border-color:var(--rule); } .tb:disabled { opacity:.4; cursor:default; } .tb.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.tb svg { width:16px; height:16px; }
.seg { display:inline-flex; border:1px solid var(--rule); border-radius:7px; overflow:hidden; }
.seg button { border:0; background:var(--panel); padding:4px 11px; color:var(--ink2); } .seg button+button { border-left:1px solid var(--rule); } .seg button.on { background:var(--accent); color:#fff; }
#fname { color:var(--muted); font-size:12px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.spacer { flex:1; }
#ribbon { display:flex; align-items:stretch; gap:2px; padding:4px 8px; background:var(--panel2); border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:thin; }
.rb { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; width:58px; padding:5px 2px 3px; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--ink2); flex:none; }
.rb svg { width:24px; height:24px; color:var(--accent); } .rb span { font-size:10.5px; line-height:1.15; }
.rb:hover { background:var(--panel); border-color:var(--rule); } .rb.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.rb kbd { position:absolute; right:3px; top:2px; font:9px var(--mono); color:var(--muted); }
.rgap { width:1px; background:var(--rule); margin:4px 5px; flex:none; }
#opts { display:flex; align-items:center; gap:10px; padding:3px 10px; background:var(--panel); border-bottom:1px solid var(--rule); min-height:32px; flex-wrap:wrap; font-size:12px; }
#opts label { display:inline-flex; align-items:center; gap:5px; color:var(--muted); }
#opts input[type=text], #opts select { height:24px; border:1px solid var(--rule); border-radius:5px; background:var(--panel); padding:0 6px; }
#opts input[type=text] { width:74px; } #opts .hint { color:var(--muted); margin-left:auto; }
#main { display:grid; grid-template-columns:250px minmax(0,1fr) 6px minmax(0,1fr); min-height:0; }
#main.v-plan { grid-template-columns:250px minmax(0,1fr) 0 0; } #main.v-3d { grid-template-columns:250px 0 0 minmax(0,1fr); } #main.v-3d #v3 { grid-column:4; }
#main.v-plan #v3, #main.v-plan #split, #main.v-3d #plan, #main.v-3d #split { display:none; }
#side { grid-column:1; } #plan { grid-column:2; } #split { grid-column:3; } #v3 { grid-column:4; }
#side { background:var(--panel); border-right:1px solid var(--rule); overflow-y:auto; min-height:0; }
.sec { border-bottom:1px solid var(--rule); } .sh { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; font:600 11px var(--font); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.sh button { border:1px solid var(--rule); background:var(--panel); border-radius:5px; padding:1px 7px; font-size:11px; text-transform:none; letter-spacing:0; color:var(--ink2); } .sh button:hover { border-color:var(--accent); color:var(--accent); }
.lvl { display:flex; align-items:center; gap:6px; padding:5px 10px; cursor:pointer; border-left:3px solid transparent; } .lvl:hover { background:var(--panel2); } .lvl.on { background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent); font-weight:600; }
.lvl small { margin-left:auto; color:var(--muted); font-weight:400; font-family:var(--mono); font-size:10.5px; }
.form { padding:2px 10px 10px; display:grid; grid-template-columns:96px 1fr; gap:5px 8px; align-items:center; }
.form label { color:var(--muted); font-size:12px; } .form input[type=text], .form select { width:100%; height:26px; border:1px solid var(--rule); border-radius:6px; background:var(--panel); padding:0 7px; min-width:0; }
.form input[type=text]:focus, #opts input:focus, #dlg input:focus { outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent); border-color:var(--accent); }
.form input[type=color] { width:100%; height:26px; padding:1px; border:1px solid var(--rule); border-radius:6px; background:var(--panel); }
.form .ro { font-family:var(--mono); font-size:12px; color:var(--ink2); } .form .full { grid-column:1 / -1; } .form .btns { display:flex; gap:6px; flex-wrap:wrap; }
.btn { border:1px solid var(--rule); background:var(--panel); border-radius:7px; padding:4px 11px; color:var(--ink2); } .btn:hover { border-color:var(--accent); color:var(--accent); } .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.dng:hover { border-color:var(--danger); color:var(--danger); }
.empty { padding:8px 10px 12px; color:var(--muted); font-size:12px; line-height:1.5; }
#plan, #v3 { position:relative; min-width:0; min-height:0; overflow:hidden; }
#plan { background:var(--paper); cursor:crosshair; touch-action:none; } #v3 { background:#dfe7f1; }
#split { background:var(--rule); cursor:col-resize; } #split:hover, #split.drag { background:var(--accent); }
#plan canvas, #v3 canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#lenIn { position:absolute; display:none; z-index:5; border:2px solid var(--accent); border-radius:6px; padding:3px 8px; font:600 13px var(--mono); background:var(--panel); box-shadow:var(--shadow); width:130px; }
.hud { position:absolute; display:flex; gap:4px; z-index:4; } .hud button { border:1px solid var(--rule); background:color-mix(in srgb,var(--panel) 92%,transparent); border-radius:6px; padding:3px 8px; font-size:11.5px; color:var(--ink2); } .hud button:hover { border-color:var(--accent); color:var(--accent); } .hud button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
#planHud { left:8px; bottom:8px; flex-wrap:wrap; max-width:60%; } #zoomHud { right:8px; bottom:8px; }
#v3Hud { left:8px; top:8px; flex-wrap:wrap; max-width:96%; } #v3Opt { left:8px; bottom:8px; background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--rule); border-radius:8px; padding:5px 9px; gap:10px; align-items:center; font-size:11.5px; color:var(--ink2); flex-wrap:wrap; }
#v3Opt select, #v3Opt input[type=range] { background:var(--panel); border:1px solid var(--rule); border-radius:4px; color:var(--ink); } #v3Opt label { display:inline-flex; align-items:center; gap:4px; } #v3Opt select, #v3Opt input[type=range] { height:20px; }
#glMsg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--muted); z-index:3; }
#status { display:flex; align-items:center; gap:14px; padding:3px 10px; background:var(--panel); border-top:1px solid var(--rule); font:11.5px var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; }
#status .msg { color:var(--ink2); font-family:var(--font); overflow:hidden; text-overflow:ellipsis; } #status .warn { color:var(--danger); }
#toast { position:fixed; left:50%; bottom:46px; transform:translateX(-50%); background:var(--ink); color:var(--panel); padding:7px 14px; border-radius:8px; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; max-width:80vw; }
#toast.show { opacity:.96; }
.menu { position:absolute; z-index:40; background:var(--panel); border:1px solid var(--rule); border-radius:8px; box-shadow:var(--shadow); padding:4px; min-width:190px; } .menu button { display:block; width:100%; text-align:left; border:0; background:transparent; padding:6px 10px; border-radius:5px; color:var(--ink); } .menu button:hover { background:var(--accent-soft); color:var(--accent); } .menu hr { border:0; border-top:1px solid var(--rule); margin:4px 0; }
#dlgBack { position:fixed; inset:0; background:rgba(10,15,25,.4); display:none; align-items:center; justify-content:center; z-index:60; } #dlg { background:var(--panel); border-radius:12px; box-shadow:var(--shadow); width:min(560px,92vw); max-height:86vh; overflow:auto; padding:18px 20px; }
#dlg h3 { margin:0 0 10px; } #dlg table { width:100%; border-collapse:collapse; font-size:12.5px; } #dlg td { padding:4px 6px; border-bottom:1px solid var(--rule); } #dlg td:first-child { font-family:var(--mono); color:var(--accent); white-space:nowrap; }
@media (max-width:900px) { #main { grid-template-columns:200px minmax(0,1fr) 6px minmax(0,1fr); } }
@media (max-width:700px) { #main { grid-template-columns:0 minmax(0,1fr) 0 0 !important; } #side,#v3,#split { display:none; } #main.v-3d { grid-template-columns:0 0 0 minmax(0,1fr) !important; } #main.v-3d #v3 { display:block; } .rb { width:50px; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="logo">House Design</span><span id="fname"></span>
    <div class="sep"></div>
    <button class="tb" id="bNew" title="Start an empty project">New</button>
    <button class="tb" id="bOpen" title="Open a saved .house.json project">Open</button>
    <button class="tb" id="bSave" title="Save the project as .house.json (Ctrl+S)">Save</button>
    <button class="tb" id="bExport" title="Export DXF plans, an OBJ model or a PNG">Export ▾</button>
    <button class="tb" id="bSample" title="Load the sample two-storey house">Sample</button>
    <div class="sep"></div>
    <button class="tb" id="bUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="tb" id="bRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg" title="Layout"><button data-v="plan">Plan</button><button data-v="split" class="on">Plan + 3D</button><button data-v="3d">3D</button></div>
    <button class="tb" id="bTheme" title="Toggle light / dark theme">◐</button>
    <button class="tb" id="bHelp" title="Shortcuts and tips (?)">Help</button>
    <input type="file" id="fileIn" accept=".json,.house,application/json" hidden>
  </div>
  <div id="ribbon"></div>
  <div id="opts"></div>
  <div id="main">
    <aside id="side">
      <div class="sec"><div class="sh">Levels <button id="bAddLvl" title="Add a level above the top one">+ Level</button></div><div id="lvlList"></div></div>
      <div class="sec"><div class="sh"><span id="propTitle">Properties</span></div><div id="props"></div></div>
    </aside>
    <section id="plan"><canvas id="pc"></canvas><input id="lenIn" type="text" autocomplete="off" spellcheck="false">
      <div class="hud" id="planHud"></div>
      <div class="hud" id="zoomHud"><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="Zoom to fit">Fit</button></div>
    </section>
    <div id="split"></div>
    <section id="v3"><canvas id="gl"></canvas><div id="glMsg">WebGL is not available in this browser, so the 3D view cannot be shown. The plan editor and exports still work.</div>
      <div class="hud" id="v3Hud"></div>
      <div class="hud" id="v3Opt"></div>
    </section>
  </div>
  <div id="status"><span id="stXY">X — Y —</span><span id="stSnap"></span><span class="msg" id="stMsg"></span><span class="spacer"></span><span id="stInfo"></span></div>
</div>
<div id="toast"></div><div id="dlgBack"><div id="dlg"></div></div>
<script>
'use strict';
/* ════════ Basics ════════
   Everything is stored in inches. Plan axes: x east, y north. World (3D) axes: X = x, Y = up, Z = −y. */
const $ = (s, r = document) => r.querySelector(s);
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1], crs = (a, b) => a[0] * b[1] - a[1] * b[0];
const len = a => Math.hypot(a[0], a[1]), dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const unit = a => { const l = len(a); return l > 1e-9 ? [a[0] / l, a[1] / l] : [1, 0]; };
const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const perp = a => [-a[1], a[0]];                      // left normal
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v)) ? v : d;
function isect(p, d, q, e) { const c = crs(d, e); if (Math.abs(c) < 1e-9) return null; const t = crs(sub(q, p), e) / c; return add(p, mul(d, t)); }
function segSeg(a, b, c, d) {                          // proper intersection params of segments ab, cd (null when parallel)
  const r = sub(b, a), s = sub(d, c), den = crs(r, s); if (Math.abs(den) < 1e-9) return null;
  const q = sub(c, a); return { t: crs(q, s) / den, u: crs(q, r) / den };
}
function ptSeg(p, a, b) {                              // {d, t, q}: distance to segment, parameter, closest point
  const e = sub(b, a), l2 = dot(e, e); const t = l2 > 1e-12 ? clamp(dot(sub(p, a), e) / l2, 0, 1) : 0; const q = add(a, mul(e, t)); return { d: dist(p, q), t, q };
}
function pip(p, poly) { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) ins = !ins; } return ins; }
const area2 = poly => { let s = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) s += poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1]; return s / 2; };
function centroid(poly) { let a = 0, cx = 0, cy = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const f = poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1]; a += f; cx += (poly[j][0] + poly[i][0]) * f; cy += (poly[j][1] + poly[i][1]) * f; } if (Math.abs(a) < 1e-9) return poly[0]; return [cx / (3 * a), cy / (3 * a)]; }
const bboxOf = pts => { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); } return [x0, y0, x1, y1]; };

/* ── Lengths: stored in inches, shown as feet-inches ── */
function fmtLen(v, o = {}) {
  if (!isFinite(v)) return '–';
  const neg = v < 0 && Math.abs(v) >= 1 / 32, den = o.den || 16;
  const tot = Math.round(Math.abs(v) * den) / den;
  let ft = Math.floor(tot / 12 + 1e-9), inch = tot - ft * 12;
  if (inch >= 12 - 1e-9) { ft++; inch = 0; }
  let whole = Math.floor(inch + 1e-9), fr = Math.round((inch - whole) * den);
  if (fr >= den) { whole++; fr = 0; }
  const g = fr ? gcd(fr, den) : 1, frs = fr ? (fr / g) + '/' + (den / g) : '';
  const is = (whole || !frs ? whole : '') + (whole && frs ? ' ' : '') + frs + '"';
  const s = ft > 0 ? (o.short && inch < 1e-9 ? ft + "'" : ft + "'-" + is) : is;
  return (neg ? '-' : '') + s;
}
const fmtIn = v => { const r = Math.round(v * 16) / 16; return (r % 1 ? String(r) : String(r | 0)) + '"'; };
function parseLen(str, def = 'ft') {
  let s = String(str).trim().toLowerCase().replace(/[”″]/g, '"').replace(/[’′]/g, "'").replace(/\s+/g, ' ');
  if (!s) return NaN;
  let m, neg = 1;
  if (s[0] === '-') { neg = -1; s = s.slice(1).trim(); } else if (s[0] === '+') s = s.slice(1).trim();
  const N = '(\\d+(?:\\.\\d+)?|\\.\\d+)';
  const frac = x => { const q = x.match(/^(\d+)\/(\d+)$/); return q && +q[2] ? +q[1] / +q[2] : NaN; };
  if ((m = s.match(new RegExp('^' + N + ' ?(mm|cm|m)$')))) return neg * parseFloat(m[1]) * { mm: 1, cm: 10, m: 1000 }[m[2]] / 25.4;
  // 12'-6 1/2"   12' 6   12'   12ft 6in
  if ((m = s.match(new RegExp('^' + N + " ?(?:'|ft|feet) ?-? ?(?:" + N + "?(?: (\\d+/\\d+))? ?(?:\"|in|inch|inches)?)?$")))) {
    let v = parseFloat(m[1]) * 12; if (m[2]) v += parseFloat(m[2]); if (m[3]) v += frac(m[3]); return isFinite(v) ? neg * v : NaN;
  }
  if ((m = s.match(new RegExp('^' + N + '(?: (\\d+/\\d+))? ?(?:"|in|inch|inches)$')))) { let v = parseFloat(m[1]); if (m[2]) v += frac(m[2]); return isFinite(v) ? neg * v : NaN; }
  if ((m = s.match(/^(\d+\/\d+) ?(?:"|in)?$/))) return neg * frac(m[1]);
  if (def === 'ft' && (m = s.match(new RegExp('^' + N + ' ?- ?' + N + '(?: (\\d+/\\d+))?$')))) { const v = parseFloat(m[1]) * 12 + parseFloat(m[2]) + (m[3] ? frac(m[3]) : 0); return isFinite(v) ? neg * v : NaN; }   // "12-6" = 12'-6"
  if ((m = s.match(new RegExp('^' + N + ' ' + N + '(?: (\\d+/\\d+))?$')))) { const v = parseFloat(m[1]) * 12 + parseFloat(m[2]) + (m[3] ? frac(m[3]) : 0); return isFinite(v) ? neg * v : NaN; }   // "12 6" = 12'-6"
  if ((m = s.match(new RegExp('^' + N + '$')))) return neg * parseFloat(m[1]) * (def === 'ft' ? 12 : 1);
  return NaN;
}
const fmtArea = a => (a / 144).toFixed(a / 144 < 100 ? 1 : 0) + ' sf';

/* ════════ Document ════════ */
const WALL_TYPES = [
  { n: 'Exterior – 8"', t: 8, c: '#e9e2d3' }, { n: 'Exterior – 6"', t: 6, c: '#e4dccb' }, { n: 'Interior – 4½"', t: 4.5, c: '#f2f0ea' },
  { n: 'Interior – 6"', t: 6, c: '#f2f0ea' }, { n: 'Masonry – 12"', t: 12, c: '#c9a58a' }, { n: 'Thin partition – 3"', t: 3, c: '#eceae4' }];
const ROOM_NAMES = ['Living Room', 'Kitchen', 'Dining', 'Bedroom', 'Primary Bedroom', 'Bath', 'Hall', 'Entry', 'Closet', 'Laundry', 'Garage', 'Office', 'Family Room', 'Pantry', 'Utility'];
const FLOOR_COLORS = { 'Living Room': '#c9a77c', Kitchen: '#d8d2c4', Dining: '#c9a77c', Bedroom: '#d2b88f', 'Primary Bedroom': '#d2b88f', Bath: '#bcc8d2', Hall: '#c9a77c', Entry: '#b9b2a4', Closet: '#d2b88f', Laundry: '#cfd5da', Garage: '#a9adb2' };
let doc = newDoc();
function newDoc() {
  return { v: 1, name: 'Untitled house', seq: 1, levels: [{ id: 'L1', name: 'Level 1', elev: 0, height: 108 }], walls: [], opens: [], rooms: [], roofs: [], stairs: [], dims: [],
    set: { floorT: 6, wallT: 6, wallType: 1, grid: 6, doorW: 36, doorH: 80, winW: 36, winH: 48, winSill: 36 } };
}
const nid = p => p + (doc.seq++);
